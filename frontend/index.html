      // Load XAIO runtime from dev-server (local) or runner (cloud)

        var baseUrl = globalThis.__XAIO_API_URL__ || 'http://localhost:8001';

        script.src = baseUrl + '/static/design-mode-runtime.js';

        };
        document.body.appendChild(script);
      })();
