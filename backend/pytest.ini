[pytest]
# Tests live in backend/tests/ and are discovered from there.
testpaths = tests
# Match test_*.py files and Test* classes / test_* functions.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Imports are relative to backend/src/ (same as the app's own PYTHONPATH).
pythonpath = src
# pytest-asyncio runs async tests automatically; no per-test decorator needed.
asyncio_mode = auto
# Run fixtures AND tests on ONE session-wide event loop — the same single-loop
# model the app runs under uvicorn. Without this, pytest-asyncio gives each test
# its own loop, and a DB connection opened in one test is reused in the next on a
# different loop → "Future attached to a different loop". (See tests/conftest.py.)
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Test kinds. `unit` = hermetic (no real DB, no network, no ambient env);
# `integration` = DB-backed (dedicated test DB, rolled back per test) and is
# auto-applied by conftest to any test using a DB fixture. Fast unit gate:
#   pytest -m "not integration"
markers =
    unit: hermetic test — no real DB, no network, no real secrets/ambient env
    integration: needs the dedicated test database (auto-marked by DB-fixture use)
# Short summaries + colors; fail fast after the first failure during local
# iteration. Remove -x in CI if you want the full failure set.
addopts = -q --tb=short -x
# Treat async warnings as errors so we don't silently miss issues.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
