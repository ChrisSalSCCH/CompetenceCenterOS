services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: circleos
      POSTGRES_USER: circleos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circleos -d circleos"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://circleos:${POSTGRES_PASSWORD}@db:5432/circleos
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ENVIRONMENT: prod
      REGISTRATION_MODE: closed
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
